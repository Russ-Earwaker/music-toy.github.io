<!doctype html><meta charset="utf-8"><title>Simple Paint onboarding regression</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../free-play.css">
<style>body{margin:0;background:#10232d}#viewport{position:relative;width:800px;height:440px;overflow:hidden;background:#142c38}#world{position:absolute;inset:0;transform-origin:0 0}.container-toy{position:relative;width:600px;height:420px}#results{color:white}</style>
<pre id="results">Running</pre><div id="viewport"><div id="world"></div></div><div id="surface"></div>
<script type="module">
import {installSimpleDrawCreation} from '../src/simple-draw-creation.js';
import {installSimpleDrawSurface} from '../src/simple-draw-surface.js';
import {createDrawOnboarding,boardHintBox} from '../src/draw-onboarding.js';
import {prepareBoardDrawing} from '../src/simple-draw-placement.js';
let count=0;const check=(v,m)=>{if(!v)throw Error(m);count++;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
try{
 const viewport=document.querySelector('#viewport'),world=document.querySelector('#world');let zoom=1,commits=[];
 const screenToWorld=p=>{const r=viewport.getBoundingClientRect();return {x:(p.x-r.left)/zoom,y:(p.y-r.top)/zoom};};
 viewport.setPointerCapture=()=>{};viewport.hasPointerCapture=()=>false;
 const creation=installSimpleDrawCreation({getViewport:()=>viewport,getWorld:()=>world,screenToWorld,commit:async p=>commits.push(p)});
 check(!world.querySelector('.draw-onboarding'),'no hint before Paint');
 for(const z of [.5,1,1.7])for(const width of [280,800]){
  zoom=z;viewport.style.width=width+'px';world.style.transform=`scale(${zoom})`;creation.arm();
  const layer=world.querySelector('.draw-onboarding'),r=layer.getBoundingClientRect(),v=viewport.getBoundingClientRect();
  check(!layer.hidden&&layer.textContent==='DRAW','Paint shows DRAW');
  check(r.left>=v.left&&r.right<=v.right&&r.top>=v.top&&r.bottom<=v.bottom,'guide fits zoom/narrow viewport');
  check(getComputedStyle(layer).pointerEvents==='none','pointer transparent');
  check(commits.length===0&&world.children.length===1,'no authored content or objects from hint');
  const box=boardHintBox(v,screenToWorld);check(Math.abs(r.width-box.width*zoom)<.1,'world coordinate positioning');
  creation.cancel();check(!world.querySelector('.draw-onboarding'),'cancel removes hint');
 }
 zoom=1;viewport.style.width='800px';world.style.transform='';creation.arm();
 const layer=world.querySelector('.draw-onboarding'),trail=layer.querySelector('path'),dot=layer.querySelector('circle');
 check(getComputedStyle(trail).animationDuration.includes('6s'),'gentle drawing loop');
 const svg=layer.querySelector('svg');svg.setCurrentTime(1);await wait(40);const a=dot.getCTM();svg.setCurrentTime(3);await wait(40);const b=dot.getCTM();check(Math.hypot(a.e-b.e,a.f-b.f)>50,'particle travels along shaped path');svg.setCurrentTime(0);
 const rect=viewport.getBoundingClientRect(),send=(type,x,y)=>viewport.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:71,button:0,buttons:type==='pointerup'?0:1,clientX:rect.left+x,clientY:rect.top+y}));
 check(document.elementFromPoint(rect.left+400,rect.top+220)!==layer,'drawing passes through hint');
 send('pointerdown',100,100);check(layer.hidden,'pointerdown removes hint immediately');check(commits.length===0,'hint never commits notes');
 send('pointermove',250,170);send('pointermove',400,90);send('pointerup',550,180);
 check(commits.length===1,'real drawing commits normally');check(!world.querySelector('.draw-onboarding'),'completion removes demonstration');
 const expected=prepareBoardDrawing([{x:100,y:100},{x:250,y:170},{x:400,y:90},{x:550,y:180}]);
 check(JSON.stringify(commits[0].bounds)===JSON.stringify(expected.bounds),'instructional path never affects authored bounds');
 check(JSON.stringify(commits[0].source)===JSON.stringify(expected.source),'instructional path never affects notes or line length');
 const query=new EventTarget();query.matches=true;const reduced=createDrawOnboarding(world,{motionQuery:query});reduced.show({box:{x:50,y:60,width:440}});
 check(getComputedStyle(reduced.layer.querySelector('circle')).display==='none','reduced motion hides travelling dot');
 check(getComputedStyle(reduced.layer.querySelector('path')).animationName==='none','reduced motion uses static path');
 check(reduced.layer.querySelector('svg').animationsPaused(),'reduced motion pauses SVG timeline');reduced.dispose();
 // Leave an isolated visual preview; it is never passed to a model or layout API.
 const preview=createDrawOnboarding(world);preview.show({box:{x:180,y:100,width:640}});
 document.querySelector('#results').textContent=`PASS ${count} assertions — board guide, zoom, narrow layout, reduced motion`;
}catch(e){document.querySelector('#results').textContent='FAIL '+e.stack;}
</script>
