<!doctype html><meta charset="utf-8"><title>Expressive UI regression</title>
<link rel="stylesheet" href="../free-play.css"><link rel="stylesheet" href="../expressive-layout.css"><link rel="stylesheet" href="../circular-button.css"><link rel="stylesheet" href="../style.css">
<style>body{margin:0;background:#12202d;color:white;font:16px system-ui}#results{position:absolute;top:10px;left:20px;white-space:pre-wrap}#comparison{position:absolute;top:100px;left:30px;display:flex;gap:70px}.sample{position:relative;width:600px;height:600px;border:1px dashed #66889955;padding:16px}.sample h2{font-size:18px;font-weight:400}.container-toy{position:absolute;inset:60px 0 0;box-sizing:border-box;border:2px solid #91c4e025;border-radius:20px;background:transparent}.art-toy-panel{position:relative!important;left:140px!important;top:210px!important}.classic{width:640px}.toy-panel{position:relative!important;margin-top:50px;width:600px!important;min-height:220px;padding:16px}.classic-controls{display:flex;gap:8px}</style>
<pre id="results">Running-</pre><main id="comparison"><section class="sample"><h2>Simple Draw - live surface</h2><section class="container-toy expressive-container" data-presentation="simple-draw" data-open="false"><div class="container-surface" id="simple"></div></section></section><section class="sample" style="width:480px"><h2>Art Toy / Flash Circle</h2><div id="art"></div></section><section class="sample classic"><h2>Classic / Loopgrid</h2><div class="toy-panel"><div class="classic-controls" id="classic"></div></div></section></main>
<script type="module">
import {installSimpleDrawSurface} from '../src/simple-draw-surface.js';
import {updateSilence} from '../src/free-play-silence.js';
import {createLineSource} from '../src/free-play-line.js';
import {createClearControl,createEnterBoardControl,createRandomControl} from '../src/circular-control.js';
import {createArtToyAt} from '../src/art/art-toy-factory.js';
import {createConnectionModel} from '../src/connections.js';
import {createContainerToyModel} from '../src/container-toys.js';
import {installSimpleDrawCreation} from '../src/simple-draw-creation.js';
import {installContainerBoard} from '../src/container-board.js';
import {initToyUI} from '../src/toyui.js';
const out=document.querySelector('#results');let passed=0;
const check=(value,message)=>{if(!value)throw Error(message);passed++;};
try{
const line={id:'line1',source:createLineSource([{x:.1,y:.6},{x:.35,y:.15},{x:.6,y:.8},{x:.9,y:.3}]),straightened:false,phase:.4};let lines=[line],paint=[],additions=0,translations=0;
line.source.events.forEach((e,i)=>e.id='note-'+i);
const api={lines:()=>lines,onNote:()=>()=>{},getGeometry:()=>({x:0,y:0,width:document.querySelector('#simple canvas').clientWidth,height:document.querySelector('#simple canvas').clientHeight}),setSilence:(id,change)=>{const l=lines.find(l=>l.id===id);updateSilence(l.source.events,change);if(change.paint)l.source.paint=change.paint;},setStraightened:(id,v)=>line.straightened=v,clear:()=>{lines=[];},unlock(){},beginContentMove(){translations++;},moveAuthoredContent(){translations++;},addLine(source){source.events.forEach((e,i)=>e.id='replacement-'+i);additions++;lines=[{id:'new',source,phase:0}];return {started:Promise.resolve()};}};
const host=document.querySelector('#simple'),surface=installSimpleDrawSurface(host,api,{get:()=>paint,set:v=>paint=v});surface.setActive(true);
const scene=host.firstElementChild,tools=()=>[...scene.querySelectorAll('button[data-tool]')],context=scene.querySelector('.expressive-context');
check(tools().length===3,'three persistent tools');
for(const tool of tools()){tool.click();check(tool.getAttribute('aria-pressed')==='true','pressed state');check(tools().every(t=>t===tool||t.getAttribute('aria-pressed')==='false'),'exclusive selection');check(tools().every(t=>!t.hidden),'palette persists');check(context.querySelector('.free-play-random').hidden===(tool.dataset.tool==='Draw'),'context random visibility');}
check(context.querySelector('[data-silence-action="Black Paint"]').title==='Wipe All','paint wipe');
tools()[1].click();check(!context.querySelector('[data-silence-action="Scissors"]').hidden,'heal visible');
tools()[0].click();check(!context.querySelector('[data-reset]').hidden,'clear in draw context');check(context.querySelector('[data-reset]').title==='Clear','clear tooltip');
const canvas=scene.querySelector('canvas');canvas.setPointerCapture=()=>{};
const point=(type,x,y)=>{const r=canvas.getBoundingClientRect();canvas.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:1,button:0,clientX:r.left+x*r.width,clientY:r.top+y*r.height}));};
const originalPath=structuredClone(line.source.path);point('pointerdown',.1,.6);point('pointermove',.8,.7);point('pointerup',.9,.5);check(additions===0&&lines[0]===line,'completed line blocks a second stroke');check(!scene.querySelector('[title="Move line"]'),'line move control removed');check(translations===0&&JSON.stringify(line.source.path)===JSON.stringify(originalPath),'dragging cannot translate a completed line');
const sparseSource=createLineSource([{x:.1,y:.5},{x:.9,y:.5}]);sparseSource.events=[sparseSource.events[0],sparseSource.events.at(-1)];sparseSource.events.forEach((e,i)=>e.id='sparse-'+i);const sparse={id:'sparse',source:sparseSource,phase:null};lines=[sparse];tools()[1].click();const crossing=(sparseSource.events[0].x+sparseSource.events[1].x)/2-.02;
point('pointerdown',crossing,.2);point('pointerup',crossing,.8);check(sparseSource.events.filter(e=>e.scissorMuted).length===1,'fast sparse crossing cuts one fallback');const chosen=sparseSource.events.find(e=>e.scissorMuted).id;sparseSource.events.forEach(e=>e.scissorMuted=false);await new Promise(r=>setTimeout(r,450));
point('pointerdown',crossing,.2);for(let y=.22;y<.8;y+=.02)point('pointermove',crossing,y);point('pointerup',crossing,.8);check(sparseSource.events.filter(e=>e.scissorMuted).length===1&&sparseSource.events.find(e=>e.scissorMuted).id===chosen,'slow sparse crossing matches fast crossing');lines=[line];tools()[0].click();
tools()[2].click();point('pointerdown',.4,.4);point('pointerup',.4,.4);check(surface.getProof().silence.paint.paint.length>0,'black paint creation');point('pointerdown',.4,.4);point('pointerup',.4,.4);check(surface.getProof().silence.paint.paint.length===0,'tap removes paint');
context.querySelector('.free-play-random').click();check(surface.getProof().silence.lastPlan.kind==='paint'||surface.getProof().silence.lastPlan.paint.length>0,'random paint');context.querySelector('[data-silence-action="Black Paint"]').click();check(surface.getProof().silence.paint.paint.length===0,'wipe all');
tools()[1].click();context.querySelector('.free-play-random').click();check(line.source.events.some(e=>e.scissorMuted),'random cuts');context.querySelector('[data-silence-action="Scissors"]').click();check(line.source.events.every(e=>!e.scissorMuted),'heal all');
point('pointerdown',.05,.6);point('pointermove',.3,.6);point('pointerup',.3,.6);check(line.source.events.some(e=>e.scissorMuted),'swipe scissors');const cut=line.source.events.find(e=>e.scissorMuted);point('pointerdown',cut.x,cut.y);point('pointerup',cut.x,cut.y);check(!cut.scissorMuted,'tap heal');context.querySelector('[data-silence-action="Scissors"]').click();
tools()[0].click();context.querySelector('[title="Straighten"]').click();check(line.straightened,'straighten');context.querySelector('[title="Re-coil"]').click();check(!line.straightened,'recoil');
const saved=structuredClone(line.source);context.querySelector('[data-reset]').click();check(!lines.length,'clear line');tools()[2].click();point('pointerdown',.4,.4);point('pointerup',.4,.4);check(surface.getProof().silence.paint.paint.length>0,'content-first empty surface paint');tools()[0].click();point('pointerdown',.1,.6);point('pointermove',.4,.4);point('pointermove',.8,.6);point('pointerup',.9,.5);check(lines.length===1&&additions===1,'Clear permits one fresh replacement line');const replacement=lines[0];point('pointerdown',.1,.2);point('pointermove',.9,.2);point('pointerup',.9,.3);check(additions===1&&lines[0]===replacement,'replacement also blocks another stroke');check(surface.getProof().silence.paint.paint.length>0,'paint retained when line materializes');lines=[{...line,source:saved}];
const art=createArtToyAt('flashCircle',{containerEl:document.querySelector('#art'),centerX:100,centerY:200});const artControls=art.querySelector('.art-toy-controls');
check(artControls.classList.contains('expressive-context'),'art shared slot');
const classicPanel=document.querySelector('#classic').parentElement;classicPanel.id='classic-test';classicPanel.dataset.toy='loopgrid';initToyUI(classicPanel,{toyName:'Loopgrid'});const classic=classicPanel.querySelector('[data-action=clear]');
check(classic.innerHTML===context.querySelector('[data-reset]').innerHTML,'identical clear markup');check(classic.querySelector('.c-btn-core').style.cssText===context.querySelector('[data-reset] .c-btn-core').style.cssText,'identical clear asset');
await new Promise(r=>setTimeout(r,150));
check(getComputedStyle(scene.querySelector('.expressive-surface')).backgroundColor==='rgba(0, 0, 0, 0)','transparent surface');
const r=scene.querySelector('canvas').getBoundingClientRect();check(r.width>0&&r.height>0,'canvas geometry');
check(getComputedStyle(art.querySelector('.art-toy-drag-btn')).top.includes('-'),'art outside handle preserved');
const second=document.createElement('div');second.style.cssText='position:absolute;width:500px;height:400px;left:-2000px';document.body.append(second);const other=installSimpleDrawSurface(second,api,{get:()=>[],set(){}});check(second.querySelector('[data-tool="Draw"]').getAttribute('aria-pressed')==='true','instance selection independent');other.dispose();second.remove();
const world=document.createElement('div');world.style.cssText='position:absolute;left:-3000px';document.body.append(world);const model=createConnectionModel();const containers=createContainerToyModel(model,{getRect:()=>({x:20,y:20,width:200,height:200}),setPosition(){}});model.registerObject('owned');const record=containers.create({presentationType:'simple-draw',width:640,height:440});containers.attach(record.id,['owned']);const board=installContainerBoard({containers,getWorld:()=>world,getCandidates:()=>[]});const card=board.cards()[0],handle=card.querySelector('.simple-container-handle'),menu=card.querySelector('.container-actions');check(menu.hidden,'structural controls initially hidden');handle.click();check(!menu.hidden,'handle reveals structural controls');const enter=card.querySelector('[data-container-action="open"]');check(enter.title==='Enter Board','container enter tooltip');enter.click();check(containers.get(record.id).presentation.state.open,'open board');enter.click();check(!containers.get(record.id).presentation.state.open,'close board');card.querySelector('[data-container-action="expand"]').click();check(!containers.get(record.id),'expand removes wrapper');const viewport=document.createElement('div');world.append(viewport);viewport.setPointerCapture=()=>{};viewport.hasPointerCapture=()=>false;const created=[];const creation=installSimpleDrawCreation({getViewport:()=>viewport,getWorld:()=>world,screenToWorld:p=>p,unlock(){},commit:async({source,bounds,contentSpace})=>{created.push(containers.create({...bounds,presentationType:'simple-draw',interactionData:{gesture:{path:source.path},contentSpace}}));}});
for(let i=0;i<2;i++){creation.arm();for(const [type,x,y]of [['pointerdown',100,100],['pointermove',500,180],['pointerup',700,120]])viewport.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:5,button:0,clientX:x+i*800,clientY:y}));}
check(created.length===2&&created[0].id!==created[1].id,'each board Paint creation makes a fresh toy');check(containers.list().length===2&&created.every(c=>c.interactionData.gesture),'board creations retain independent authored lines');creation.cancel();board.dispose();containers.dispose();world.remove();
out.textContent=`PASS ${passed} UI assertions\nComparison fixture: live Simple Draw + Flash Circle + classic Loopgrid chrome`;
const selected=new URLSearchParams(location.search).get('tool');if(selected)scene.querySelector('button[data-tool='+JSON.stringify(selected)+']')?.click();
}catch(e){out.textContent='FAIL '+e.stack;}
</script>
