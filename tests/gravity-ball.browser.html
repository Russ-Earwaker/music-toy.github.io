<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../circular-button.css"><link rel="stylesheet" href="../free-play.css"><link rel="stylesheet" href="../simple-bouncer.css"><link rel="stylesheet" href="../simple-drum.css"><link rel="stylesheet" href="../string-surface.css">
<style>body{margin:0;background:#10232d;color:white}#viewport{position:relative;width:1250px;height:760px;overflow:hidden}#world{position:absolute;inset:0}.fixture-cannon{position:absolute;width:65px;height:65px;border-radius:50%;background:#25465d;color:white;border:4px solid #8cc5e4;font-size:28px;transform:translate(-50%,-50%)}pre{white-space:pre-wrap}</style>
<select id="audition-target" aria-label="Audition receiver"><option value="string">String</option><option value="strum">Strum</option><option value="drum">Drum</option></select><button id="listen" disabled>Audition gravity playground</button><button id="compare" disabled>Compare manual / trigger</button><button id="stop" disabled>Stop audition</button><pre id="results">Running</pre><div id="viewport"><div id="world"></div></div><pre id="audio-results"></pre>
<script type="module">
import {createBoardPhysicalObjects} from '../src/board-physical-objects.js';
import {createContainerToyModel} from '../src/container-toys.js';
import {createConnectionModel,HEARTBEAT_PORTS} from '../src/connections.js';
import {createSimpleBouncerController} from '../src/simple-bouncer.js';
import {installBoardBouncer} from '../src/board-bouncer.js';
import {boardLaunch,simulateThrow} from '../src/simple-bouncer-physics.js';
import {createTickTransport} from '../src/tick-transport.js';
import {createDrumObjects} from '../src/simple-drum.js';
import {createDrumLoopController} from '../src/simple-drum-loop.js';
import {installSimpleDrumBoard} from '../src/simple-drum-board.js';
import {createStringSurfaces} from '../src/string-surface.js';
import {createStringSurfaceLoop} from '../src/string-surface-loop.js';
import {installStringSurfaceBoard} from '../src/string-surface-board.js';
import {boardCollisionBody} from '../src/board-collision-body.js';
import {ensurePlaybackInstance,getPlaybackInstance} from '../src/playback-instances.js';
import {normalizeAuthoredState,restoreAuthoredNotes,drawgridPatternFromState} from '../src/drawgrid/dg-authored-notes.js';
import {ensureAudioContext,getToyGain,setToyVolume,setToyMuted} from '../src/audio-core.js';
import {triggerInstrument,initAudioAssets,cancelScheduledToySources} from '../src/audio-samples.js';
import {midiToName} from '../src/note-helpers.js';
const wait=ms=>new Promise(r=>setTimeout(r,ms));let assertions=0;const check=(v,m)=>{if(!v)throw Error(m);assertions++;};
try{
 const viewport=document.querySelector('#viewport'),world=document.querySelector('#world'),physical=createBoardPhysicalObjects(),strings=createStringSurfaces(),drums=createDrumObjects(),panels=new Map(),positions=new Map(),events=[],feedback=[];let context={state:'running',currentTime:0},serial=0,service,ballBoard,playing=false,playStarts=0;
 const transport=createTickTransport({id:'qa',getContext:()=>context,emit:e=>{if(e.type==='play')playStarts++;stringLoop?.transportChanged('qa',e.type,e.fromState);drumLoop?.transportChanged('qa',e.type,e.fromState);service?.resetReceiverAdmissions();}});
 const model=createConnectionModel();model.registerObject('heartbeat',{ports:HEARTBEAT_PORTS,transportId:'qa'});
 const schedule=e=>{events.push(e);if(playing){setToyVolume(e.sourceId,e.volume);setToyMuted(e.sourceId,e.muted);for(const midi of e.sourceMidis||[e.sourceMidi])triggerInstrument(e.instrument,midiToName(midi),e.when,e.sourceId,{pitched:!e.instrument.startsWith('DRUM'),pitchShift:true,eventTick:e.eventTick});}};
 const stringLoop=createStringSurfaceLoop({objects:strings,getTransport:()=>transport,getTriggerTransport:()=>transport,schedule,cancel:id=>{if(playing)cancelScheduledToySources(id);}}),drumLoop=createDrumLoopController({objects:drums,getTransport:()=>transport,schedule,cancel:id=>{if(playing)cancelScheduledToySources(id);}});stringLoop.subscribe(e=>feedback.push(e));drumLoop.subscribe(e=>feedback.push(e));
 const containers=createContainerToyModel(model,{getRect:id=>positions.get(id),getDuration:()=>384,setPosition:(id,x,y)=>positions.set(id,{...positions.get(id),x,y}),removeInternal:id=>{panels.get(id)?.remove();panels.delete(id);positions.delete(id);model.removeObject(id);}});
 const applyGrid=async(p,state)=>{p.state=normalizeAuthoredState(state);p.dataset.steps=String(state.steps);p.dataset.instrument=state.instrument;restoreAuthoredNotes(p,p.state);p.__seqPattern=drawgridPatternFromState(p.state);const instance=ensurePlaybackInstance(p.id,{loopLengthTicks:state.authoredDurationTicks||384});Object.assign(instance,{active:true,startTick:0,endTick:Infinity,transportId:'qa'});};
 const bodies=()=>[...physical.list('cube'),...drums.list().map(boardCollisionBody),...strings.list().map(boardCollisionBody)];
 service=createSimpleBouncerController({containers,objects:physical,getCollisionObjects:bodies,getToy:id=>panels.get(id),createGrid:async(state,pos)=>{const p=document.createElement('div');p.id='grid-'+(++serial);p.dataset.toy='drawgrid';p.hidden=true;p.__sequencerSchedule=()=>{};world.append(p);positions.set(p.id,{...pos,width:100,height:100});panels.set(p.id,p);model.registerObject(p.id);await applyGrid(p,state);return p;},applyGrid,removeGrid:p=>{p.remove();panels.delete(p.id);model.removeObject(p.id);},publish(){},getTransport:()=>transport,onReceiverTrigger:e=>(strings.get(e.receiverId)?stringLoop:drumLoop).trigger({...e,sourceMidi:12,sourceMidis:[12],instrument:'WRONG TRIGGER',volume:1})});
 const common={getWorld:()=>world,getViewport:()=>viewport,screenToWorld:e=>{const r=viewport.getBoundingClientRect();return {x:(e.x??e.clientX)-r.left,y:(e.y??e.clientY)-r.top};},unlock:()=>{}};
 const stringBoard=installStringSurfaceBoard({...common,objects:strings,controller:stringLoop,onArm:()=>ballBoard.cancel()}),drumBoard=installSimpleDrumBoard({...common,objects:drums,controller:drumLoop,onArm:()=>ballBoard.cancel()});
 let lastCannon=null;
 const createCannon=(mode,launch)=>{const c=service.create({x:launch.x,y:launch.y,ballMode:mode});model.connect('transport',{objectId:'heartbeat',portId:'output'},{objectId:c.id,portId:'input'});const shell=document.createElement('button');shell.className='fixture-cannon';shell.id=c.id;shell.textContent=mode==='gravity'?'\u2193':'\u2192';shell.setAttribute('aria-label',mode==='gravity'?'Gravity Cannon':'Normal Cannon');shell.style.left=launch.x+'px';shell.style.top=launch.y+'px';world.append(shell);return c;};
 ballBoard=installBoardBouncer({...common,objects:physical,controller:service,getCollisionObjects:bodies,getBpm:()=>transport.bpm,onArm:()=>{stringBoard.cancel();drumBoard.cancel();},createCapture:async({ballId,launch,release,ballMode})=>{const c=createCannon(ballMode,launch);await service.throwBall(c.id,{ballId,launch,targetPosition:release});lastCannon=c.id;}});
 viewport.setPointerCapture=()=>{};viewport.hasPointerCapture=()=>false;
 const send=(type,p)=>{const r=viewport.getBoundingClientRect();viewport.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:1,button:0,buttons:type==='pointerup'?0:1,clientX:r.left+p.x,clientY:r.top+p.y}));};
 const clear=()=>{ballBoard.cancel();for(const c of containers.list()){containers.remove(c.id);document.getElementById(c.id)?.remove();}physical.clear();strings.clear();drums.clear();transport.hardStop();transport.seekTick(0);events.length=0;feedback.length=0;};
 const run=async(kind='string',mode='gravity')=>{clear();let receiver;
  if(kind==='cube')receiver=physical.addCube(600,400,{sourceMidi:69});else if(kind==='drum')receiver=drums.create({x:600,y:400,instrument:'DRUM SNARE 1'});else if(kind==='string'||kind==='strum')receiver=strings.create({kind,start:{x:350,y:400},end:{x:850,y:400},instrument:'KALIMBA'});
  const launch=boardLaunch({x:600,y:150},{x:600,y:250});ballBoard.arm({mode:mode==='gravity'?'gravity':'ball',seed:false});send('pointerdown',{x:600,y:150});send('pointermove',{x:600,y:250});const points=world.querySelector('.physical-creation-prediction').getAttribute('points');const expected=simulateThrow({launch,cubes:bodies(),bpm:120,ballMode:mode});check(points===expected.trajectory.map(p=>`${p.x},${p.y}`).join(' '),'live preview matches committed swept simulation '+kind);send('pointerup',{x:600,y:250});await wait(80);const d=service.data(lastCannon);check(JSON.stringify(d.capture.trajectory)===JSON.stringify(expected.trajectory),'commit parity '+kind);check(d.ballMode===mode,'authored mode '+kind);check(transport.state==='playing','commit starts transport '+kind);if(receiver)check(d.capture.collisions.some(e=>e.cubeId===receiver.id),'physical collision '+kind);
  return {receiver,id:lastCannon,capture:d.capture};
 };
 ballBoard.arm({mode:'gravity',seed:false});check(!physical.list('ball').length,'palette selection does not launch');const teaching=world.querySelector('.simple-interaction-hint');check(teaching.dataset.ballMode==='gravity'&&teaching.querySelector('span').textContent==='SWIPE','gravity reuses SWIPE');check(teaching.querySelector('.interaction-hint-trajectory').getAttribute('points').split(' ').length>5,'teaching is a simulated curve');
 for(const kind of ['cube','drum','string','strum']){const {receiver,id}=await run(kind);const before=JSON.stringify(kind==='drum'?drums.snapshot():strings.snapshot());for(let tick=0;tick<384;tick+=2){context.currentTime=transport.tickToAudioTime(tick);service.scheduleReceiverHits();service.scheduleReceiverHits();stringLoop.tick();drumLoop.tick();}if(kind==='cube'){check(service.panels(id)[0].__dgAuthoredNotes.every(n=>n.sourceMidi===69),'Cube supplies pitch');check(service.panels(id)[0].dataset.instrument==='KALIMBA','Cannon supplies Cube instrument');}else{check(events.length>0&&events.every(e=>e.sourceId===receiver.id),'receiver owns sound '+kind);check(feedback.length>0,'canonical hit feedback '+kind);check(JSON.stringify(kind==='drum'?drums.snapshot():strings.snapshot())===before,'trigger does not record '+kind);check(new Set(events.map(e=>[e.eventTick,e.lane].join(':'))).size===events.length,'no duplicated collision attacks '+kind);}}
 // A manual tap and a real captured contact must use the same current surface voice.
 const sameSound=e=>JSON.stringify([e.sourceMidis,e.instrument,e.volume,e.lane,e.region]);
 for(const mode of ['normal','gravity'])for(const kind of ['string','strum'])for(const region of kind==='string'?[0,1,2,3,4,5,6,7]:[1,5])for(const lane of kind==='strum'?[0,1,2,3]:[0]){
  clear();const receiver=strings.create({kind,start:{x:350,y:400},end:{x:850,y:400},instrument:'KALIMBA'}),x=350+(region+.5)*62.5,y=kind==='strum'?400+(lane-1.5)*22:400;
  const launch={x,y:kind==='strum'?y:150,vx:0,vy:kind==='strum'?(lane<2?100:-100):840},c=createCannon(mode,launch),ball=physical.addBall(launch.x,launch.y,{ballMode:mode});await service.throwBall(c.id,{ballId:ball.id,launch});lastCannon=c.id;
  strings.update(receiver.id,{instrument:'PIANO',volume:.29,mode:kind==='string'&&region%2?'chord':'note'});const capture=service.data(c.id).capture,hit=capture.collisions[0],tick=(capture.phaseOffsetTick||0)+hit.tick;context.currentTime=transport.tickToAudioTime(tick);service.scheduleReceiverHits();stringLoop.tick();
  const triggered=events.find(e=>e.activationSource==='trigger');check(triggered&&triggered.region===region&&triggered.lane===lane,'captured '+mode+' '+kind+' actual fret/lane');check(!strings.get(receiver.id).authoredState.recordedEvents.length,'trigger has no persistent markers');
  ballBoard.cancel();send('pointerdown',{x,y});send('pointerup',{x,y});await wait(25);const manual=events.find(e=>e.activationSource==='manual');check(manual&&sameSound(manual)===sameSound(triggered),'manual/trigger current-note parity '+mode+' '+kind+' '+region+'/'+lane);check(strings.get(receiver.id).authoredState.recordedEvents.length===1,'only real manual tap records');
  check(triggered.instrument==='PIANO'&&triggered.volume===.29,'receiver instrument and volume beat trigger payload');
 }
 const saved=JSON.parse(JSON.stringify(containers.snapshot())),physicalSave=JSON.parse(JSON.stringify(physical.authoredSnapshot()));physical.restore(physicalSave);containers.restore(saved);service.migrateLegacy();check(service.data(lastCannon).ballMode==='gravity','reload preserves Gravity mode');check(physical.list('ball')[0].ballMode==='gravity','reload preserves marked Ball');
 const receiverId=strings.list()[0].id,ballId=physical.list('ball')[0].id;containers.remove(lastCannon);document.getElementById(lastCannon)?.remove();check(!physical.get(ballId)&&strings.get(receiverId),'delete removes owned Ball and retains shared Strum');
 for(const end of [{x:450,y:150},{x:400,y:0},{x:250,y:300},{x:350,y:250}]){const launch=boardLaunch({x:250,y:150},end),g=simulateThrow({launch,cubes:[],ballMode:'gravity'}),n=simulateThrow({launch,cubes:[]});check(g.trajectory.at(-1).y>n.trajectory.at(-1).y,'horizontal/shallow/up/down launches fall');}
 clear();await run('string');transport.hardStop();document.querySelector('#results').textContent=`PASS ${assertions} assertions: shared Ball UI, curved hint/preview, Cube/Drum/String/Strum, transient feedback, persistence, deletion and launch angles`;
 let analyser;const samples=new Float32Array(2048);let peak=0;
 document.querySelector('#listen').disabled=false;document.querySelector('#stop').disabled=false;document.querySelector('#compare').disabled=false;
 document.querySelector('#listen').onclick=async()=>{context=ensureAudioContext();await context.resume();await initAudioAssets('../samples.csv');playing=true;peak=0;analyser=context.createAnalyser();analyser.fftSize=2048;getToyGain('master').connect(analyser);await run(document.querySelector('#audition-target').value);};
 // Collect an actual manual/Cannon pair on a deterministic clock, then audition
 // its two resolved voices separately so same-cell admission cannot merge them.
 document.querySelector('#compare').onclick=async()=>{try{const audio=ensureAudioContext();await audio.resume();await initAudioAssets('../samples.csv');playing=false;context={state:'running',currentTime:0};await run(document.querySelector('#audition-target').value==='strum'?'strum':'string');ballBoard.cancel();const receiver=strings.list()[0];strings.update(receiver.id,{mode:'chord',instrument:'PIANO',volume:.4});const first=service.data(lastCannon).capture.collisions[0],point=first.contact.position;send('pointerdown',point);send('pointerup',point);await wait(30);await service.throwBall(lastCannon);const capture=service.data(lastCannon).capture,hit=capture.collisions[0];context.currentTime=transport.tickToAudioTime((capture.phaseOffsetTick||0)+hit.tick);service.scheduleReceiverHits();stringLoop.tick();const pair=[events.find(e=>e.activationSource==='manual'),events.find(e=>e.activationSource==='trigger')];if(pair.some(e=>!e))throw Error('Comparison pair was not admitted');peak=0;analyser=audio.createAnalyser();analyser.fftSize=2048;getToyGain('master').connect(analyser);playing=true;pair.forEach((e,i)=>{setToyVolume(e.sourceId,e.volume);for(const midi of e.sourceMidis)triggerInstrument(e.instrument,midiToName(midi),audio.currentTime+.15+i*.5,e.sourceId,{pitched:true,pitchShift:true});});await wait(1400);analyser.getFloatTimeDomainData(samples);peak=Math.max(peak,...samples.map(Math.abs));playing=false;transport.hardStop();document.querySelector('#audio-results').textContent='Manual/trigger sample comparison '+JSON.stringify(pair.map(e=>({source:e.activationSource,notes:e.sourceMidis,instrument:e.instrument,lane:e.lane,region:e.region})))+'; manual markers '+strings.list()[0].authoredState.recordedEvents.length+'; audio peak '+peak.toFixed(5);}catch(error){document.querySelector('#audio-results').textContent='Comparison failed: '+error.message;}};
 document.querySelector('#stop').onclick=()=>{playing=false;transport.hardStop();for(const o of [...strings.list(),...drums.list()])cancelScheduledToySources(o.id);};
 setInterval(()=>{if(playing){service.scheduleReceiverHits();stringLoop.tick();drumLoop.tick();}},20);
 function animate(){if(playing&&analyser){analyser.getFloatTimeDomainData(samples);peak=Math.max(peak,...samples.map(Math.abs));document.querySelector('#audio-results').textContent=`Audio peak ${peak.toFixed(5)}; transient notes ${events.map(e=>e.sourceMidi).slice(0,12)}; receiver ${events[0]?.instrument||''}; recorded markers ${strings.list()[0]?.authoredState.recordedEvents.length||drums.list()[0]?.authoredState.pattern.authoredNotes.length||0}`;}requestAnimationFrame(animate);}animate();
}catch(error){document.querySelector('#results').textContent='FAIL '+error.stack;}
</script>
